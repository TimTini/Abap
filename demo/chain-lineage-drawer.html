<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chain Lineage · Drawer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220; --panel: #0f172a; --border: #22324a; --text: #e5e7eb;
      --muted: #94a3b8; --accent: #60a5fa; --hover: #1e293b; --code-bg: #0b1526;
      --edge: #4b6a8a; --cycle: #c47a2a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: "Segoe UI", Tahoma, sans-serif; color: var(--text); background: var(--bg); overflow: hidden; }
    .app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
    .topbar { flex: 0 0 auto; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .topbar h1 { margin: 0; font-size: 17px; }
    .sub, .muted, .hint { color: var(--muted); font-size: 12px; margin: 0; }
    .nav a { color: var(--accent); margin-left: 10px; font-size: 12px; }
    .main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
    .code-pane { flex: 1; min-height: 0; overflow: auto; background: var(--code-bg); border-bottom: 1px solid var(--border); }
    .code { margin: 0; padding: 12px; font-family: Consolas, monospace; font-size: 12.5px; line-height: 1.55; white-space: pre; }
    .chain-token { border: 1px solid transparent; border-radius: 3px; padding: 0 1px; cursor: pointer; }
    .chain-token:hover { border-color: rgba(96,165,250,.55); background: rgba(96,165,250,.08); }
    .chain-token.is-active { border-color: #f59e0b; background: rgba(245,158,11,.28); }
    .drawer {
      flex: 0 0 auto;
      height: 0;
      overflow: hidden;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: height 0.2s ease;
    }
    .drawer.is-open { height: min(46vh, 420px); }
    .drawer-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .drawer-head h2 { margin: 0; font-size: 13px; }
    .drawer-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.4fr 0.8fr; }
    .canvas-wrap, .detail { overflow: auto; padding: 10px; min-height: 0; }
    .detail { border-left: 1px solid var(--border); }
    button { font: inherit; min-height: 30px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--hover); color: var(--text); cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .dag-edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
    .dag-edge.is-cycle { stroke: var(--cycle); stroke-dasharray: 5 4; }
    .dag-node rect { fill: #152033; stroke: var(--border); stroke-width: 1.2; cursor: pointer; }
    .dag-node.is-root rect { stroke: var(--accent); fill: #132a44; }
    .dag-node.is-selected rect { stroke: #f59e0b; fill: #3a2a12; }
    .dag-node text { fill: var(--text); font-size: 11px; pointer-events: none; }
    .code-snip { margin: 8px 0 0; padding: 8px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; font-family: Consolas, monospace; font-size: 11.5px; white-space: pre-wrap; }
    .pill { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 999px; background: var(--hover); color: var(--muted); }
    @media (max-width: 800px) { .drawer-body { grid-template-columns: 1fr; } .detail { border-left: 0; border-top: 1px solid var(--border); } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>2 · Bottom drawer</h1>
        <p class="sub">Code full · click token → kéo sheet dưới (DAG + detail).</p>
      </div>
      <div class="nav">
        <span class="hint" id="fxRef"></span>
        <a href="./chain-lineage-index.html">Index</a>
      </div>
    </header>
    <div class="main">
      <div class="code-pane"><pre class="code" id="codePanel"></pre></div>
      <aside class="drawer" id="drawer" aria-label="Lineage drawer">
        <div class="drawer-head">
          <h2 id="drawerTitle">Lineage</h2>
          <button type="button" id="btnClose">Đóng</button>
        </div>
        <div class="drawer-body">
          <div class="canvas-wrap"><svg id="dagSvg"></svg></div>
          <div class="detail" id="detailPanel"><p class="muted">Chọn node.</p></div>
        </div>
      </aside>
    </div>
  </div>
  <script src="./chain-dot-popover.fixture.js"></script>
  <script src="./chain-lineage-common.js"></script>
  <script>
    (function () {
      var L = window.ChainLineage;
      var fx = L.fixture();
      if (!fx) { document.getElementById("codePanel").textContent = "Missing fixture"; return; }
      document.getElementById("fxRef").textContent = fx.sourceRef || "";
      var codePanel = document.getElementById("codePanel");
      var drawer = document.getElementById("drawer");
      var dagSvg = document.getElementById("dagSvg");
      var detailPanel = document.getElementById("detailPanel");
      var drawerTitle = document.getElementById("drawerTitle");

      codePanel.innerHTML = L.renderCodeHtml(fx);

      function openRoot(rootId, tokenEl) {
        var chain = L.findChain(rootId);
        if (!chain) return;
        codePanel.querySelectorAll(".chain-token.is-active").forEach(function (el) { el.classList.remove("is-active"); });
        if (tokenEl) tokenEl.classList.add("is-active");
        drawer.classList.add("is-open");
        drawerTitle.textContent = "Lineage · " + rootId;
        L.renderDagSvg(dagSvg, chain, {
          onNodeClick: function (id, node) {
            detailPanel.innerHTML = L.nodeDetailHtml(node);
          }
        });
        detailPanel.innerHTML = L.nodeDetailHtml((chain.nodes || []).filter(function (n) { return n.role === "root"; })[0]);
      }

      function closeDrawer() {
        drawer.classList.remove("is-open");
        codePanel.querySelectorAll(".chain-token.is-active").forEach(function (el) { el.classList.remove("is-active"); });
      }

      codePanel.addEventListener("click", function (e) {
        var t = e.target.closest(".chain-token");
        if (!t) return;
        openRoot(t.getAttribute("data-root-id"), t);
      });
      document.getElementById("btnClose").addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeDrawer();
      });
    })();
  </script>
</body>
</html>
